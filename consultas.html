      const zones=Object.fromEntries(ZONES.map(z=>[z.key,[]]));const known=new Set();const nv=Array.isArray(r.nuevas)?r.nuevas:[];Object.entries(r.ubicaciones||{}).forEach(([cid,k])=>{if((BY_ID[cid]||nv.some(c=>c.id===cid))&&zones[k]){zones[k].push(cid);known.add(cid)}});
      S={id:r.id,nombre:r.nombre,deck:shuffle([...CARDS.map(c=>c.id),...nv.map(c=>c.id)].filter(c=>!known.has(c))),zones,nuevas:nv,seconds:r.segundos||0,done:false};persist();history.replaceState(null,"",location.pathname);return viewBoard()}
    catch{app.replaceChildren(h("div",{class:"done"},h("h2",{},"No encontramos ese avance"),h("button",{class:"btn primary",type:"button",onclick(){history.replaceState(null,"",location.pathname);boot()}},"Ir al inicio")));return}}
  const s=store.get();if(s&&s.id){S=s;if(!S.done&&!Array.isArray(S.nuevas))S.nuevas=[];if(S.done)return viewDone();return viewBoard()}
  viewIntro();
}
addEventListener("hashchange",boot);
boot();
</script>
