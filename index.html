<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Card Sorting One Touch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: una mesa de trabajo. Mazo fijo a la izquierda, categorías como pilas a la derecha. */
:root{
  --bg:#e9efee;--surface:#fbfdfc;--sunken:#dde6e4;--ink:#122a2e;--muted:#566c70;--line:#c3d1cf;
  --accent:#0a6a6e;--accent-ink:#ffffff;--pick:#f6c445;--pick-ink:#3a2b00;--danger:#b23a2e;--ok:#23704a;
  --card:#ffffff;--shadow:0 1px 0 rgba(18,42,46,.1),0 2px 6px rgba(18,42,46,.08);
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --body:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --head:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1b1e;--surface:#16262a;--sunken:#0b1416;--ink:#e4efee;--muted:#9db2b4;--line:#2c4347;
  --accent:#4cc3c0;--accent-ink:#06282a;--pick:#f6c445;--pick-ink:#3a2b00;--danger:#ef8a7c;--ok:#74cfa0;
  --card:#1d3136;--shadow:0 1px 0 rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1b1e;--surface:#16262a;--sunken:#0b1416;--ink:#e4efee;--muted:#9db2b4;--line:#2c4347;
  --accent:#4cc3c0;--accent-ink:#06282a;--pick:#f6c445;--pick-ink:#3a2b00;--danger:#ef8a7c;--ok:#74cfa0;
  --card:#1d3136;--shadow:0 1px 0 rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100dvh}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .9rem;font-weight:500;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{min-height:36px;padding:.3rem .7rem;font-size:.9rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-weight:500}
.field{display:grid;gap:.3rem;min-width:0}
.field label,.label{font-weight:600;font-size:.92rem}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;min-height:44px}
textarea{min-height:90px;resize:vertical}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Bienvenida */
.intro{max-width:1040px;margin:0 auto;padding-block:clamp(28px,6vw,72px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(24px,5vw,64px);align-items:start}
.intro-copy{display:grid;gap:1.1rem;min-width:0}
.intro-copy p{max-width:58ch}
.how{list-style:none;padding:0;margin:.4rem 0 0;display:grid;gap:.7rem}
.how li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.5rem;align-items:baseline}
.how b{font-family:var(--mono);color:var(--accent);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:grid;gap:1rem;min-width:0}
.fan{position:relative;height:96px;margin-bottom:.2rem}
.fan span{position:absolute;left:50%;top:14px;width:150px;height:62px;margin-left:-75px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;text-align:center;padding:4px}
.fan span:nth-child(1){transform:translateX(-62px) rotate(-8deg)}
.fan span:nth-child(2){transform:translateX(62px) rotate(7deg)}
.fan span:nth-child(3){transform:translateY(4px);border-color:var(--accent)}

/* Mesa */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .name{font-family:var(--display);font-weight:700;font-size:1.1rem;margin-right:auto}
.progress{display:flex;align-items:center;gap:8px;min-width:170px;flex:0 1 240px}
.bar{height:8px;flex:1;border-radius:4px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.saved{font-size:.82rem;color:var(--muted);white-space:nowrap}
.saved.bad{color:var(--danger);font-weight:600}
.table{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.deck{position:sticky;top:calc(var(--head) + 12px);max-height:calc(100dvh - var(--head) - 28px);display:flex;flex-direction:column;background:var(--sunken);border-radius:12px;padding:12px;gap:8px;min-width:0}
.deck-list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px;flex:1;min-height:0}
.empty{color:var(--muted);padding:12px;text-align:center}
.tcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;box-shadow:var(--shadow);line-height:1.3;font-size:.95rem;font-weight:500;touch-action:manipulation;user-select:none;-webkit-user-select:none;min-height:44px;overflow-wrap:anywhere}
.tcard:hover{border-color:var(--accent)}
.tcard[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}
.tcard.ghosted{opacity:.35}
.ghost{position:fixed;z-index:60;pointer-events:none;width:240px;transform:rotate(-2deg) translate(-20px,-16px);box-shadow:0 10px 24px rgba(0,0,0,.28)}
.ghost em{position:absolute;right:-8px;top:-10px;background:var(--accent);color:var(--accent-ink);font:500 .78rem var(--mono);border-radius:10px;padding:0 7px}
.board{display:grid;gap:12px;min-width:0}
.unknown,.pile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.unknown{border-style:dashed}
.pile-head{display:flex;gap:6px;align-items:center}
.pile-head input{min-height:38px;padding:.3rem .5rem;font-weight:600}
.pile-head input:placeholder-shown{border-color:var(--danger)}
.count{font-size:.8rem;color:var(--muted);min-width:1.6em;text-align:right}
.icon{border:0;background:none;width:36px;height:36px;border-radius:6px;color:var(--muted);flex:none}
.icon:hover{background:var(--sunken);color:var(--ink)}
.pile-cards{display:flex;flex-direction:column;gap:5px;max-height:320px;overflow:auto;padding:1px}
.unknown .pile-cards{flex-direction:row;flex-wrap:wrap}
.unknown .tcard{width:auto;max-width:100%}
.drop-hint{font-size:.88rem;color:var(--muted)}
.is-over{outline:3px solid var(--accent);outline-offset:1px}
.piles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-items:start}
.newpile{border:2px dashed var(--line);background:none;border-radius:10px;min-height:96px;font-weight:600;color:var(--accent);padding:12px}
.newpile:hover{border-color:var(--accent)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--bg);display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.actionbar .btn{color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(480px,calc(100vw - 32px));max-height:calc(100dvh - 48px)}
dialog::backdrop{background:rgba(6,18,20,.55)}
.dlg{display:grid;gap:.9rem}
.movelist{display:grid;gap:6px;max-height:44dvh;overflow:auto}
.movelist .btn{text-align:left;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.err{color:var(--danger);font-weight:500}
.done{max-width:640px;margin:0 auto;padding-block:clamp(40px,10vw,110px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:1rem}

/* Resultados */
.res{max-width:1240px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.lock{max-width:420px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px}
.stat b{display:block;font:500 1.7rem/1.1 var(--mono)}
.stat span{font-size:.86rem;color:var(--muted)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.filters .field{flex:0 1 170px}
.check{display:flex;gap:.45rem;align-items:center;min-height:44px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:.6rem .8rem;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.clusters{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;align-items:start}
.cluster{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:6px;min-width:0}
.cluster ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:.93rem}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:.5rem .7rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;background:var(--sunken);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.heatwrap{position:relative;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:760px}
canvas{display:block}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:.4rem .6rem;border-radius:6px;font-size:.85rem;max-width:320px}
.slider{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.slider input{flex:0 1 260px;accent-color:var(--accent)}
.note{font-size:.9rem;color:var(--muted);max-width:70ch}

@media (max-width:800px){
  :root{--head:0px}
  .intro{grid-template-columns:minmax(0,1fr)}
  .top{position:static}
  .table{grid-template-columns:minmax(0,1fr)}
  .deck{position:static;max-height:46dvh}
  .piles{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){
    if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k in e&&k!=="list")e[k]=v;

}

let drag=null,dragJustEnded=false;
function dragStart(e){
  if(e.pointerType!=="mouse"&&e.pointerType!=="pen")return;
  if(e.button!==0)return;
  drag={id:e.currentTarget.dataset.id,x:e.clientX,y:e.clientY,active:false,ghost:null,over:null,ids:null};
  addEventListener("pointermove",dragMove);addEventListener("pointerup",dragEnd,{once:true});
}
function dragMove(e){
  if(!drag)return;
  if(!drag.active){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;
    drag.active=true;
    drag.ids=selected.has(drag.id)?[...selected]:[drag.id];
    drag.ghost=h("div",{class:"tcard ghost"},label(drag.id),drag.ids.length>1?h("em",{},drag.ids.length):null);
    document.body.append(drag.ghost);
    drag.ids.forEach(id=>{const n=document.querySelector(`.tcard[data-id="${id}"]`);if(n)n.classList.add("ghosted")});
  }
  drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
  const t=document.elementFromPoint(e.clientX,e.clientY),zone=t&&t.closest("[data-drop]");
  if(zone!==drag.over){if(drag.over)drag.over.classList.remove("is-over");if(zone)zone.classList.add("is-over");drag.over=zone}
  const m=70,v=e.clientY<m?-14:e.clientY>innerHeight-m?14:0;if(v)scrollBy(0,v);
}
function dragEnd(){
  removeEventListener("pointermove",dragMove);
  const d=drag;drag=null;if(!d||!d.active)return;
  d.ghost.remove();if(d.over)d.over.classList.remove("is-over");
  document.querySelectorAll(".ghosted").forEach(n=>n.classList.remove("ghosted"));
  dragJustEnded=true;setTimeout(()=>dragJustEnded=false,50);
  if(!d.over)return;
  const z=d.over.dataset.drop;
  if(z==="new")newPile(d.ids);else move(d.ids,z);
}

function analyze(rows){
  const n=CARDS.length,idx=Object.fromEntries(CARDS.map((c,i)=>[c.id,i]));
  const tog=new Float64Array(n*n),both=new Float64Array(n*n),unk=new Float64Array(n),seen=new Float64Array(n);
  const cats=new Map(),perCard=CARDS.map(()=>new Map());
  for(const r of rows){
    const gs=(r.grupos||[]);const placed=[];
    for(const g of gs){
      const ids=(g.c||[]).map(c=>idx[c]).filter(i=>i!=null);
      if(g.n===UNKNOWN){ids.forEach(i=>{unk[i]++;seen[i]++});continue}
      const name=norm(g.n)||"(sin nombre)";
      if(!cats.has(name))cats.set(name,{name:g.n||"(sin nombre)",people:0,cards:new Map()});
      const ct=cats.get(name);ct.people++;
      for(const i of ids){seen[i]++;ct.cards.set(i,(ct.cards.get(i)||0)+1);const m=perCard[i];const e=m.get(name)||{name:g.n,count:0};e.count++;m.set(name,e)}
      for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){tog[ids[a]*n+ids[b]]++;tog[ids[b]*n+ids[a]]++}
      placed.push(...ids);
    }
    for(let a=0;a<placed.length;a++)for(let b=a+1;b<placed.length;b++){both[placed[a]*n+placed[b]]++;both[placed[b]*n+placed[a]]++}
  }
  const sim=new Float64Array(n*n);for(let i=0;i<n*n;i++)sim[i]=both[i]?tog[i]/both[i]:0;
  /* enlace promedio */
  const D=new Float64Array(n*n);for(let i=0;i<n*n;i++)D[i]=1-sim[i];
  const alive=Array.from({length:n},(_,i)=>i),size=new Array(n).fill(1),node=Array.from({length:n},(_,i)=>({leaf:i}));const merges=[];
  while(alive.length>1){
    let best=Infinity,x=-1,y=-1;
    for(let a=0;a<alive.length;a++)for(let b=a+1;b<alive.length;b++){const d=D[alive[a]*n+alive[b]];if(d<best){best=d;x=a;y=b}}
    const i=alive[x],j=alive[y];merges.push({i,j,sim:1-best});
    node[i]={l:node[i],r:node[j]};
    for(const k of alive){if(k===i||k===j)continue;const d=(D[i*n+k]*size[i]+D[j*n+k]*size[j])/(size[i]+size[j]);D[i*n+k]=d;D[k*n+i]=d}
    size[i]+=size[j];alive.splice(y,1);
  }
  const order=[];(function walk(t){const st=[t];while(st.length){const c=st.pop();if(c.leaf!=null)order.push(c.leaf);else{st.push(c.r);st.push(c.l)}}})(node[alive[0]]);
  return{n,sim,both,unk,seen,cats,perCard,merges,order};
}
function cutClusters(d,t){
  const p=Array.from({length:d.n},(_,i)=>i),find=x=>{while(p[x]!==x)x=p[x]=p[p[x]];return x};
  for(const m of d.merges)if(m.sim>=t&&m.sim>0)p[find(m.j)]=find(m.i);
  const g=new Map();for(const i of d.order){const r=find(i);if(!g.has(r))g.set(r,[]);g.get(r).push(i)}
  return[...g.values()].sort((a,b)=>b.length-a.length);
}

async function boot(){
  const hash=location.hash;
  if(hash==="#resultados"){let k=null;try{k=sessionStorage.getItem("csot:k")}catch{}return k?loadResults(k):viewLock()}
  if(hash.startsWith("#s-")){
    const id=hash.slice(3);
    app.replaceChildren(h("p",{class:"empty"},"Recuperando tu avance…"));
    try{
      const r=await rpc("cargar_respuesta",{p_id:id});
      if(!r)throw 0;
      if(r.completado){S={...(store.get()||{}),done:true};return viewDone()}
      const known=new Set(),gs=r.grupos||[];
      const unknown=(gs.find(g=>g.n===UNKNOWN)||{c:[]}).c.filter(c=>BY_ID[c]);unknown.forEach(c=>known.add(c));
      const piles=gs.filter(g=>g.n!==UNKNOWN).map((g,i)=>{const cards=(g.c||[]).filter(c=>BY_ID[c]);cards.forEach(c=>known.add(c));return{id:"g"+i+Date.now().toString(36),name:g.n||"",cards}});
      S={id:r.id,perfil:{pais:r.pais,canal:r.canal,antiguedad:r.antiguedad},deck:shuffle(CARDS.map(c=>c.id).filter(c=>!known.has(c))),piles,unknown,seconds:r.segundos||0,done:false};
      persist();history.replaceState(null,"",location.pathname);return viewBoard();
    }catch{
      app.replaceChildren(h("div",{class:"done"},h("h2",{},"No encontramos ese avance"),h("p",{},"Revisa que el enlace esté completo o empieza de nuevo."),h("button",{class:"btn primary",type:"button",onclick(){history.replaceState(null,"",location.pathname);boot()}},"Ir al inicio")));
      return;
    }
  }
  const saved=store.get();
  if(saved&&saved.id){S=saved;if(S.done)return viewDone();return viewBoard()}
  viewIntro();
}
